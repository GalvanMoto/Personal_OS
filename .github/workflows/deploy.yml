name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute deployment commands over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GH_TOKEN
          script_stop: true
          script: |
            echo "🚀 Starting deployment on server..."
            cd /var/www/personal-os
            
            # Configure Git safe directory & authenticated fetch
            git config --global --add safe.directory /var/www/personal-os
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/GalvanMoto/Personal_OS.git"
            
            # Pull latest changes from main
            rm -f .git/index.lock .git/refs/remotes/origin/main.lock 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            
            # Install dependencies & generate prisma client
            npm install
            npm run db:generate
            
            # Apply any pending database migrations
            npx prisma migrate deploy
            
            # Remove stale Next.js build artifacts & build cleanly
            rm -rf /var/www/personal-os/.next /var/www/personal-os/.chunk-cache 2>/dev/null || true
            npm run build
            
            # Restart PM2 processes with updated environment & fresh build memory
            pm2 restart personal-os --update-env || pm2 start npm --name "personal-os" -- run start -- -p 3004
            pm2 restart personal-os-worker --update-env || pm2 start npm --name "personal-os-worker" -- run worker
            pm2 save
            
            echo "✅ Deployment completed successfully!"
